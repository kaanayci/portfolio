<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – Portfolio</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <h1 id="channel-title">Météo</h1>
      <button id="theme-toggle" aria-label="Changer de thème">🌙</button>
    </header>

    <!-- Main layout -->
    <div class="layout">
      <!-- Sidebar navigation -->
      <nav class="sidebar" aria-label="Navigation des salons">
        <ul>
          <li data-channel="home" class="active">🏠 Panorama</li>
          <li data-channel="meteo">🌤 Recherche</li>
          <li data-channel="mountain">🏔️ Montagne</li>
          <li data-channel="settings">⚙️ Paramètres</li>
        </ul>
      </nav>

      <!-- Main content -->
      <main class="content" role="main">
      </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>Projet Dashboard – Portfolio d’intégration web</p>
    </footer>

    <!-- JavaScript -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
