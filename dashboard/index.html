<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – Portfolio</title>

    <!-- PWA Config -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.svg">

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <h1 id="channel-title">Météo</h1>
      <button id="theme-toggle" aria-label="Changer de thème">🌙</button>
    </header>

    <!-- Main layout -->
    <div class="layout">
      <!-- Sidebar navigation -->
      <nav class="sidebar" aria-label="Navigation des salons">
        <ul>
          <li data-channel="home" class="active">🏠 Panorama</li>
          <li data-channel="meteo">🌤 Recherche</li>
          <li data-channel="favorites">🌟 Favoris</li>
          <li data-channel="mountain">🏔️ Montagne</li>
          <li data-channel="map">🗺️ Carte</li>
          <li data-channel="compare">🆚 Comparateur</li>
          <li data-channel="settings">⚙️ Paramètres</li>
        </ul>
      </nav>

      <!-- Main content -->
      <main class="content" role="main">
      </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>Projet Dashboard – Portfolio d’intégration web</p>
    </footer>

    <!-- JavaScript -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Modules JS -->
    <script src="assets/js/modules/config.js"></script>
    <script src="assets/js/modules/ui.js"></script>
    <script src="assets/js/modules/weather.js"></script>
    <script src="assets/js/modules/favorites.js"></script>
    <script src="assets/js/modules/panorama.js"></script>
    <script src="assets/js/modules/map.js"></script>
    <script src="assets/js/modules/compare.js"></script>
    
    <!-- Main App Logic -->
    <script src="assets/js/app.js"></script>
  </body>
</html>
