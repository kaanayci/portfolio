<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Hitster – Timeline Musicale</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <main>
      <section class="top-layout">
        <header>
          <h1>Hipster – Timeline Musicale</h1>
          <p>Place la musique au bon endroit dans le temps</p>
        </header>

        <section class="controls">
          <div id="playlist-select">
            <p>🎵 Playlist Spotify (optionnel)</p>
            <input
              type="text"
              id="playlist-url"
              placeholder="Lien de playlist Spotify"
            />
            <button id="start-game">Démarrer la partie</button>
          </div>

          <p id="score">Score : 0</p>

          <section id="current-card">
            <p class="hint">
              🎧 Écoute la musique et place la carte dans la timeline
            </p>
            <audio id="audio" controls></audio>
          </section>
        </section>
      </section>

      <section id="timeline"></section>
      <p id="message"></p>

      <div id="game-over-modal" class="modal hidden">
        <div class="modal-content">
          <h2 id="modal-title">Partie Terminée</h2>
          <p id="modal-message">Bravo !</p>
          <p class="final-score" id="modal-score">Score final : 0</p>

          <div class="modal-actions">
            <button id="btn-restart">🔄 Recommencer</button>
            <button id="btn-new-playlist">🎵 Changer de playlist</button>
          </div>
        </div>
      </div>
    </main>

    <script src="assets/js/game.js"></script>
    
  </body>
</html>
