<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hitster – Timeline Musicale</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
    <link rel="stylesheet" href="assets/css/loader.css" />
  </head>
  <body>
    <div id="bg-effects"></div>
    <main>
      <section class="top-layout">
        <header>
          <h1>Hipster – Timeline Musicale</h1>
          <p>Place la musique au bon endroit dans le temps</p>
        </header>

        <section class="controls">
          <div id="playlist-select">
            <p>🎵 Playlist Spotify (optionnel)</p>
            <input
              type="text"
              id="playlist-url"
              placeholder="Lien de playlist Spotify"
            />
            <select id="difficulty-select">
              <option value="easy">Facile (3 vies + indices)</option>
              <option value="normal" selected>Normal (3 vies)</option>
              <option value="hard">Difficile (Mort subite)</option>
            </select>
            <button id="start-game">Démarrer la partie</button>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
               <p id="score" style="margin: 0;">Score : 0</p>
               <p id="high-score" style="margin: 0; font-size: 0.9rem; color: #adb5bd;">Record : 0</p>
            </div>
            <p id="lives" style="font-size: 1.2rem; display: none;">❤️❤️❤️</p>
          </div>

          <section id="current-card">
            <p class="hint">
              🎧 Écoute la musique et place la carte dans la timeline
            </p>
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                <p id="card-hint" style="color: #3ec5ff; font-weight: bold; min-height: 1.5rem; margin: 0;"></p>
                <div id="audio-loading" class="audio-loader"></div>
            </div>
            <div id="custom-audio-player" class="player-container">
              <button id="play-pause-btn" class="player-btn">▶</button>
              <div class="progress-wrapper" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
              </div>
              <span id="time-display">00:00</span>
            </div>
            <audio id="audio"></audio>
          </section>
        </section>
      </section>

      <section id="timeline"></section>
      <p id="message"></p>

      <div id="game-over-modal" class="modal hidden">
        <div class="modal-content">
          <h2 id="modal-title">Partie Terminée</h2>
          <p id="modal-message">Bravo !</p>
          <p class="final-score" id="modal-score">Score final : 0</p>

          <div id="styles-qrcode" style="margin: 1rem 0; display: flex; flex-direction: column; align-items: center;">
             <p id="qrcode-mess" style="margin-bottom: 0.5rem; font-size: 0.9rem; color: #adb5bd;">Ajouter sur Spotify :</p>
             <div id="qrcode"></div>
          </div>

          <div style="margin-bottom: 1rem;">
            <label for="modal-difficulty" style="display:block; margin-bottom: 0.5rem; color: #adb5bd;">Difficulté prochaine partie :</label>
            <select id="modal-difficulty" style="padding: 0.5rem; border-radius: 6px; border:none; width: 100%; max-width: 250px;">
              <option value="easy">Facile (3 vies + indices)</option>
              <option value="normal" selected>Normal (3 vies)</option>
              <option value="hard">Difficile (Mort subite)</option>
            </select>
          </div>

          <div class="modal-actions">
            <button id="btn-restart">🔄 Recommencer</button>
            <button id="btn-new-playlist">🎵 Changer de playlist</button>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="assets/js/game.js"></script>
    
  </body>
</html>
